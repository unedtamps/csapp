receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

exporters:
  # otlp:
  #   endpoint: https://otlp-gateway-prod-ap-southeast-2.grafana.net/otlp
  #   headers:
  #     Authorization: "Basic ${GRAFANA_AUTH}"
  otlphttp: # ← nama diganti
    endpoint: https://otlp-gateway-prod-ap-southeast-2.grafana.net/otlp
    headers:
      Authorization: "Basic ${GRAFANA_AUTH}"
  debug:
    verbosity: detailed

service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [otlphttp, debug]
    metrics:
      receivers: [otlp]
      exporters: [otlphttp, debug]
    logs:
      receivers: [otlp]
      exporters: [otlphttp, debug]
