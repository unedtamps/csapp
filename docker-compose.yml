services:
  postgres:
    image: postgres:17
    container_name: postgres-db-cs
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_cs:/var/lib/postgresql/data
  mongodb:
    image: mongo:7.0
    container_name: mongodb-db-cs
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: mydb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data_cs:/data/db
volumes:
  postgres_data_cs:
  mongo_data_cs:
