spring.application.name=csapp

# Profile
spring.profiles.active=dev

# postgresql
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=8080

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migrations
spring.flyway.baseline-on-migrate=true

#MongoDB
spring.mongodb.uri=${MONGODB_URI}


# STOMP Broker Relay (RabbitMQ)
spring.rabbitmq.stomp.relay-host=${RABBITMQ_HOST}
spring.rabbitmq.stomp.relay-port=${RABBITMQ_PORT}
spring.rabbitmq.stomp.virtual-host=${RABBITMQ_VHOST}
spring.rabbitmq.stomp.login=${RABBITMQ_USER}
spring.rabbitmq.stomp.passcode=${RABBITMQ_PASSWORD}
spring.rabbitmq.stomp.system-login=${RABBITMQ_SYSTEM_USER}
spring.rabbitmq.stomp.system-passcode=${RABBITMQ_SYSTEM_PASSWORD}

# SpringWolf AsyncAPI
springwolf.docket.base-package=com.mycomp.csapp.chats
springwolf.docket.info.title=CS App STOMP API
springwolf.docket.info.version=1.0.0
springwolf.docket.servers.stomp.protocol=stomp
springwolf.docket.servers.stomp.host=localhost:8080

spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration


# Security
spring.security.admins=${SPRING_SECURITY_ADMINS}
spring.security.jwt.secret=${SPRING_SECURITY_JWT_SECRET}
spring.security.jwt.access-token-expiration=${SPRING_SECURITY_JWT_ACCESS_TOKEN_EXPIRATION}
spring.security.jwt.refresh-token-expiration=${SPRING_SECURITY_JWT_REFRESH_TOKEN_EXPIRATION}

# CORS allowed origins (comma-separated patterns; "*" = all, exact URL = strict)
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS}

#logging
logging.pattern.correlation=[%X{trace_id:-},%X{span_id:-}]
logging.include-application-name=false

#infisical
app.infisical.environment=dev
