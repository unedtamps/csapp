spring.application.name=application

# Profile
spring.profiles.active=dev

# postgresql
spring.datasource.url=jdbc:postgresql://localhost:5432/mydb
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=8080

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migrations
spring.flyway.baseline-on-migrate=true

#MongoDB
spring.mongodb.uri=mongodb://root:password@localhost:27017/mydb?authSource=admin


# Security
spring.security.admins=${SPRING_SECURITY_ADMINS}
spring.security.jwt.secret=${SPRING_SECURITY_JWT_SECRET}
spring.security.jwt.access-token-expiration=${SPRING_SECURITY_JWT_ACCESS_TOKEN_EXPIRATION}
spring.security.jwt.refresh-token-expiration=${SPRING_SECURITY_JWT_REFRESH_TOKEN_EXPIRATION}
